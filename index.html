<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KHXOPXD— Personal Bio</title>
<meta name="description" content="Personal bio page — แก้ไขข้อความนี้ได้ใน CONFIG">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1120'/%3E%3Cpath d='M16 6l9 5v10l-9 5-9-5V11z' fill='none' stroke='%2338BDF8' stroke-width='2.500'/%3E%3C/svg%3E">
<style>
:root{
  --primary:#38BDF8; --electric:#0EA5E9; --bg:#0B1120; --card:#111827;
  --gray:#94A3B8; --text:#F1F5F9; --border:rgba(148,163,184,.2);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Thai",sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:radial-gradient(60% 50% at 20% 10%,rgba(14,165,233,.22),transparent 70%),radial-gradient(50% 50% at 85% 85%,rgba(148,163,184,.14),transparent 70%),var(--bg);
  background-size:140% 140%;animation:drift 22s ease-in-out infinite alternate}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:44px 44px;opacity:.35;
  -webkit-mask-image:radial-gradient(circle at 50% 45%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 45%,#000,transparent 75%)}
.ring{position:absolute;border:1px solid rgba(56,189,248,.18);border-radius:50%}
.r1{width:560px;height:560px;left:50%;top:45%;margin:-280px 0 0 -280px;animation:spin 60s linear infinite;border-style:dashed}
.r2{width:820px;height:820px;left:50%;top:45%;margin:-410px 0 0 -410px;animation:spin 90s linear infinite reverse}
canvas{position:absolute;inset:0;width:100%;height:100%}
@keyframes drift{from{background-position:0 0}to{background-position:100% 100%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.6)}50%{box-shadow:0 0 0 6px rgba(56,189,248,0)}}
#loader{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--bg);transition:opacity .5s,visibility .5s}
#loader.done{opacity:0;visibility:hidden}
#loader i{width:44px;height:44px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
main{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.wrap{animation:rise .9s .1s both cubic-bezier(.2,.7,.2,1);width:100%;max-width:440px}
.card{animation:float 7s ease-in-out infinite;position:relative;padding:22px 20px 18px;border-radius:24px;
  background:linear-gradient(160deg,rgba(17,24,39,.85),rgba(11,17,32,.78));border:1px solid var(--border);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(14,165,233,.08);transition:border-color .3s,box-shadow .3s}
.card:hover{border-color:rgba(56,189,248,.5);box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 50px rgba(56,189,248,.2)}
.top{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.08em;color:var(--gray)}
.tag{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--primary);animation:pulse 2s infinite}
.avatar{position:relative;width:min(44vw,168px);aspect-ratio:1;margin:22px auto 16px}
.avatar::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px dashed rgba(56,189,248,.55);animation:spin 14s linear infinite}
.avatar img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--primary);background:var(--bg);box-shadow:0 0 28px rgba(56,189,248,.55),inset 0 0 20px rgba(56,189,248,.2)}
.center{text-align:center}
h1{margin:0;font-size:clamp(1.5rem,6vw,1.9rem);letter-spacing:.02em}
.user{color:var(--primary);font-size:.9rem;margin:6px 0}
.bio{color:var(--gray);margin:8px 0 14px;line-height:1.6;font-size:.95rem}
.status{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:rgba(148,163,184,.1);border:1px solid var(--border);font-size:.82rem}
.status .dot{width:7px;height:7px}
hr{border:0;border-top:1px solid var(--border);margin:22px 0 16px}
.label{text-align:center;font-size:.78rem;letter-spacing:.12em;color:var(--gray);margin-bottom:14px}
.socials{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.s{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 10px;min-height:76px;border-radius:16px;
  background:rgba(17,24,39,.9);border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:.66rem;
  transition:transform .25s,border-color .25s,box-shadow .25s,color .25s;-webkit-tap-highlight-color:transparent}
.s svg{width:26px;height:26px;fill:currentColor;transition:color .25s,filter .25s}
.s:hover,.s:focus-visible{transform:translateY(-5px) scale(1.05);border-color:var(--primary);color:var(--primary);box-shadow:0 8px 24px rgba(56,189,248,.28)}
.s:hover svg{filter:drop-shadow(0 0 6px rgba(56,189,248,.8))}
.s:active{transform:scale(.94)}
.s::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);white-space:nowrap;padding:5px 9px;border-radius:8px;background:#000;border:1px solid var(--border);color:var(--text);font-size:.7rem;opacity:0;pointer-events:none;transition:.2s;z-index:3}
.s:hover::after,.s:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.s[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.s[aria-disabled=true]:hover{transform:none;box-shadow:none;border-color:var(--border);color:var(--text)}
a:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.foot{text-align:center;margin-top:16px;font-size:.68rem;letter-spacing:.14em;color:var(--gray)}
main{padding-bottom:120px}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(56,189,248,.14),transparent 70%);opacity:0;transition:opacity .3s}
.card:hover::before{opacity:1}
.card::after{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--primary),transparent);opacity:.7;animation:scan 6s linear infinite;pointer-events:none}
@keyframes scan{0%{top:6%;opacity:0}10%,90%{opacity:.7}100%{top:94%;opacity:0}}
.avatar{transition:transform .15s ease-out;will-change:transform}
h1{cursor:default}h1:hover{animation:glitch .35s steps(2) 2}
@keyframes glitch{0%{text-shadow:2px 0 var(--primary),-2px 0 var(--gray);transform:translateX(1px)}50%{text-shadow:-2px 0 var(--primary),2px 0 var(--gray);transform:translateX(-1px)}100%{text-shadow:none;transform:none}}
.bio.typing::after{content:"|";color:var(--primary);animation:pulse 1s steps(2) infinite;box-shadow:none}
.player{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;width:min(440px,calc(100% - 24px))}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:rgba(17,24,39,.88);border:1px solid var(--border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 24px rgba(14,165,233,.1)}
.eq{display:flex;align-items:flex-end;gap:2px;height:22px;flex:none}
.eq i{width:3px;height:6px;border-radius:2px;background:var(--primary)}
.playing .eq i{animation:eq .8s ease-in-out infinite alternate}.playing .eq i:nth-child(2){animation-delay:.2s}.playing .eq i:nth-child(3){animation-delay:.4s}.playing .eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{from{height:4px}to{height:22px}}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.meta b{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{width:100%;height:14px;margin:0;accent-color:var(--primary);background:transparent}
.pb{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--border);background:rgba(148,163,184,.08);color:var(--text);cursor:pointer;transition:.2s;padding:0}
.pb svg{width:18px;height:18px;fill:currentColor}
.pb:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 0 14px rgba(56,189,248,.35)}.pb:active{transform:scale(.92)}
.pb:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
#play{background:var(--primary);color:#04121f;border-color:var(--primary)}#play:hover{color:#04121f;box-shadow:0 0 18px rgba(56,189,248,.7)}
.drawer{margin-bottom:8px;padding:10px;border-radius:18px;background:rgba(11,17,32,.94);border:1px solid var(--border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-height:46vh;overflow:auto;animation:rise .3s both}
.drawer[hidden]{display:none}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;padding:8px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--gray);font:inherit;font-size:.8rem;cursor:pointer}
.tab.on{color:var(--primary);border-color:var(--primary);background:rgba(56,189,248,.1)}
#list{list-style:none;margin:0;padding:0}
#list li{display:flex;align-items:center;border-radius:10px}
#list li.on{background:rgba(56,189,248,.12)}#list li.on .tn{color:var(--primary)}
#list .tn{flex:1;min-width:0;text-align:left;padding:10px;border:0;background:transparent;color:var(--text);font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .rm{border:0;background:transparent;color:var(--gray);font-size:1.2rem;cursor:pointer;padding:6px 10px}
#list .empty{padding:12px;color:var(--gray);font-size:.82rem}
.addbtn{display:block;text-align:center;padding:14px;border:1px dashed var(--primary);border-radius:12px;color:var(--primary);cursor:pointer;font-size:.88rem}
.addbtn:hover{background:rgba(56,189,248,.1)}
.hint{color:var(--gray);font-size:.74rem;line-height:1.5;margin:10px 2px 0}
#vol{width:64px;flex:none}
@media(max-width:520px){#vol{display:none}}
@media(max-width:380px){.s{font-size:.6rem}.s svg{width:22px;height:22px}}
@media(max-width:600px){.r2{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="loader" aria-hidden="true"><i></i></div>
<div class="bg" aria-hidden="true"><div class="grid"></div><div class="ring r1"></div><div class="ring r2"></div><canvas id="fx"></canvas></div>
<main>
  <div class="wrap"><section class="card" aria-label="Profile">
    <div class="top"><span class="tag"><span class="dot"></span><span id="badge"></span></span><span id="code"></span></div>
    <div class="avatar"><img id="avatar" alt="" width="168" height="168"></div>
    <div class="center">
      <h1 id="name"></h1>
      <div class="user" id="user"></div>
      <p class="bio" id="bio"></p>
      <span class="status"><span class="dot"></span><span id="status"></span></span>
    </div>
    <hr>
    <div class="label">CONNECT WITH ME</div>
    <nav class="socials" id="socials" aria-label="Social links"></nav>
    <div class="foot" id="foot"></div>
  </section></div>
</main>
<div class="player" id="player" role="region" aria-label="Music player">
  <div class="drawer" id="drawer" hidden>
    <div class="tabs" role="tablist"><button class="tab on" data-t="list" role="tab">เพลย์ลิสต์</button><button class="tab" data-t="add" role="tab">เพิ่มเพลง</button></div>
    <ul id="list"></ul>
    <div id="addp" hidden>
      <label class="addbtn" for="file">＋ เลือกไฟล์เพลงจากเครื่อง (MP3 / WAV / M4A / OGG)</label>
      <input id="file" type="file" accept="audio/*" multiple hidden>
      <p class="hint">เลือกได้หลายไฟล์พร้อมกัน เพลงจะถูกเก็บไว้ในเบราว์เซอร์ของคุณเท่านั้นและยังอยู่หลังรีเฟรช ไม่ได้อัปโหลดไปที่ไหน</p>
    </div>
  </div>
  <div class="bar">
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <div class="meta"><b id="tt">ยังไม่มีเพลง</b><input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek"></div>
    <button class="pb" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="pb" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="pi"><path d="M7 4v16l13-8z"/></svg></button>
    <button class="pb" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <input type="range" id="vol" min="0" max="1" step="0.05" value="0.7" aria-label="Volume">
    <button class="pb" id="menu" aria-label="Playlist" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h8v2H3zM18 5v9.500A3 3 0 1 0 20 17V8h2V5z"/></svg></button>
  </div>
</div>
<script>
/* ============ CONFIG — แก้ข้อมูลทั้งหมดตรงนี้ที่เดียว ============ */
const CONFIG = {
  site: { title: "KHXOPXD — Personal Bio", description: "Personal bio page" },
  profile: {
    badge: "PERSONAL SPACE",      // เช่น CREATOR
    displayName: "KHXOPXD",
    username: "@KHXOPXDATN",
    bio: "EN NU , E-SPORT PLAYER , MANAGER",
    status: "Available online",
    avatar: "https://cdn.discordapp.com/attachments/1314969858882015273/1563916157541679246/file_00000000c6a061f79cae4d26a4438498.png?ex=6adf5dec&is=6ade0c6c&hm=1afe22e00b466f01a32f78219b7930af269e2065161027fe36af0ed616eb16ba&",                   // ใส่ path เช่น "images/me.png" หรือ URL (png/jpg/webp); ว่าง = รูปตัวอย่าง
    footer: "BLUE GLOW • DARK UI • CLEAN MOTION"
  },
  // ใส่ลิงก์ https://... ของจริง; เว้นว่าง = ปิดการคลิก แสดง Not configured
  socialLinks: { facebook: "https://www.facebook.com/anuratporchaisuree/", line: "", tiktok: "https://www.tiktok.com/@khaopad_unknowsource", discord: "", instagram: "https://www.instagram.com/zx_ta24s/" },
  // เพลงบังคับ: วางไฟล์ไว้ในโฟลเดอร์ music/ ข้างไฟล์เว็บ (ลบออกจากเพลย์ลิสต์ไม่ได้)
  // ถ้านามสกุลไฟล์ไม่ใช่ .mp3 ให้แก้ src ให้ตรงกับไฟล์จริง
  playlist: [
    { title: "PLENG - รองเท้าเนรคุณ ft. เส็งเคร็ง", src: "song1.mp3" },
    { title: "GUNNER - แอ๊ดคาราบาว FT.YOUNGGU", src: "song2.mp3" },
    { title: "Song 3", src: "music/sung3.mp3" }
  ],
  // ผู้เข้าชมยังกดปุ่มเพลย์ลิสต์ > เพิ่มเพลง เพื่อเลือกไฟล์จากเครื่องเพิ่มได้
  theme: { primaryColor: "#38BDF8", backgroundColor: "#0B1120", textColor: "#F1F5F9", accentColor: "#0EA5E9" }
};
/* ================================================================== */
const ICONS = {
  facebook:{name:"Facebook",svg:'<path d="M13.5 22v-8.2h2.8l.5-3.300h-3.300V8.400c0-1 .4-1.700 1.800-1.700h1.600V3.800c-.3 0-1.300-.2-2.400-.2-2.600 0-4.300 1.600-4.300 4.400v2.500H7.500v3.300h2.700V22z"/>'},
  line:{name:"LINE",svg:'<path d="M12 2.500C6.500 2.500 2 6 2 10.400c0 3.900 3.500 7.200 8.300 7.800.3.100.8.200.9.500.1.300.1.700 0 1l-.2 1c0 .3-.2 1.100 1 .6s6.300-3.700 8.600-6.300c1.600-1.700 2.300-3.400 2.300-5.200C22.900 6 18 2.500 12 2.500zM8.300 12.600H6.200c-.3 0-.5-.2-.5-.5V8.500c0-.3.200-.5.500-.5s.5.200.5.500v3.100h1.600c.3 0 .5.200.5.500s-.2.500-.5.500zm1.900-.5c0 .3-.2.500-.5.500s-.5-.2-.5-.5V8.500c0-.3.200-.5.500-.5s.5.200.5.500zm4.900 0c0 .2-.1.400-.3.500h-.2c-.2 0-.3-.1-.4-.2l-1.700-2.300v2c0 .3-.2.500-.5.500s-.5-.2-.5-.5V8.500c0-.2.100-.4.300-.5h.2c.2 0 .3.100.4.200l1.700 2.300V8.500c0-.3.200-.5.500-.5s.5.200.5.500zm3.100-2.300c.3 0 .5.200.5.500s-.2.500-.5.500h-1.600v.6h1.600c.3 0 .5.200.5.500s-.2.500-.5.500h-2.100c-.3 0-.5-.2-.5-.5V8.500c0-.3.200-.5.500-.5h2.100c.3 0 .5.200.5.500s-.2.500-.5.500h-1.600v.8z"/>'},
  tiktok:{name:"TikTok",svg:'<path d="M16.600 2h-3.200v13.200a2.900 2.900 0 1 1-2.900-2.900c.3 0 .6 0 .8.100V9.100a6.200 6.200 0 1 0 5.300 6.100V8.800a7.500 7.500 0 0 0 4.300 1.400V7a4.300 4.300 0 0 1-4.300-5z"/>'},
  discord:{name:"Discord",svg:'<path d="M19.300 5.300A17 17 0 0 0 15 4l-.2.400a15.500 15.500 0 0 0-5.600 0L9 4a17 17 0 0 0-4.300 1.300C2 9.300 1.300 13.200 1.600 17a17 17 0 0 0 5.200 2.600l1.100-1.800a11 11 0 0 1-1.700-.8l.4-.3a12 12 0 0 0 10.800 0l.4.300c-.5.300-1.100.6-1.700.8l1.100 1.800a17 17 0 0 0 5.200-2.600c.4-4.400-.7-8.300-3.100-11.700zM8.700 14.700c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2zm6.600 0c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2z"/>'},
  instagram:{name:"Instagram",svg:'<path d="M7.500 2h9A5.500 5.500 0 0 1 22 7.500v9a5.500 5.500 0 0 1-5.500 5.500h-9A5.500 5.500 0 0 1 2 16.500v-9A5.500 5.500 0 0 1 7.500 2zm0 2A3.500 3.500 0 0 0 4 7.500v9A3.500 3.500 0 0 0 7.500 20h9a3.500 3.500 0 0 0 3.500-3.500v-9A3.500 3.500 0 0 0 16.500 4zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.300-3.300a1.200 1.200 0 1 1 0 2.400 1.200 1.200 0 0 1 0-2.400z"/>'}
};
const $=id=>document.getElementById(id), P=CONFIG.profile, T=CONFIG.theme;
const root=document.documentElement.style;
root.setProperty("--primary",T.primaryColor);root.setProperty("--bg",T.backgroundColor);root.setProperty("--text",T.textColor);root.setProperty("--electric",T.accentColor);
document.title=CONFIG.site.title;
document.querySelector('meta[name=description]').content=CONFIG.site.description;
$("badge").textContent=P.badge;$("code").textContent=P.code||"";$("name").textContent=P.displayName;
$("user").textContent=P.username;$("bio").textContent=P.bio;$("status").textContent=P.status;$("foot").textContent=P.footer;
const ph="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#0B1120"/><path d="M100 40l50 28v56l-50 32-50-32V68z" fill="none" stroke="#38BDF8" stroke-width="5"/><path d="M100 72l22 13v28l-22 15-22-15V85z" fill="#0EA5E9" opacity=".7"/></svg>');
const av=$("avatar");av.alt="รูปโปรไฟล์ของ "+P.displayName;av.src=P.avatar||ph;av.onerror=()=>{av.onerror=null;av.src=ph};
const valid=u=>{try{const x=new URL(u);return x.protocol==="https:"||x.protocol==="http:"}catch{return false}};
$("socials").innerHTML=Object.keys(ICONS).map(k=>{
  const i=ICONS[k],u=(CONFIG.socialLinks[k]||"").trim(),ok=valid(u);
  const svg='<svg viewBox="0 0 24 24" aria-hidden="true">'+i.svg+'</svg><span>'+i.name+'</span>';
  return ok?'<a class="s" href="'+u.replace(/"/g,"&quot;")+'" target="_blank" rel="noopener noreferrer" aria-label="'+i.name+'" data-tip="'+i.name+'">'+svg+'</a>'
           :'<a class="s" role="link" aria-disabled="true" tabindex="0" aria-label="'+i.name+' (Not configured)" data-tip="'+i.name+' · Not configured">'+svg+'</a>';
}).join("");
$("socials").addEventListener("click",e=>{if(e.target.closest('[aria-disabled=true]'))e.preventDefault()});
window.addEventListener("load",()=>setTimeout(()=>$("loader").classList.add("done"),350));
/* extra effects */
(function(){
  const rm=matchMedia("(prefers-reduced-motion: reduce)").matches;if(rm)return;
  const card=document.querySelector(".card"),avt=document.querySelector(".avatar"),bio=$("bio"),txt=P.bio;
  bio.textContent="";bio.classList.add("typing");let k=0;
  setTimeout(function ty(){bio.textContent=txt.slice(0,++k);if(k<txt.length)setTimeout(ty,40);else bio.classList.remove("typing")},900);
  card.addEventListener("pointermove",e=>{const r=card.getBoundingClientRect();card.style.setProperty("--mx",(e.clientX-r.left)+"px");card.style.setProperty("--my",(e.clientY-r.top)+"px")});
  if(matchMedia("(hover:hover)").matches)addEventListener("pointermove",e=>{const dx=e.clientX/innerWidth-.5,dy=e.clientY/innerHeight-.5;avt.style.transform="perspective(600px) rotateY("+dx*18+"deg) rotateX("+(-dy*18)+"deg)"});
})();
/* music player */
(function(){
  const au=new Audio(),pl=[];let cur=-1,db=null;au.volume=.7;au.preload="metadata";
  const pb=$("player"),L=$("list"),esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const PLAY='<path d="M7 4v16l13-8z"/>',PAUSE='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  function render(){
    L.innerHTML=pl.length?pl.map((t,i)=>'<li class="'+(i===cur?"on":"")+'"><button class="tn" data-i="'+i+'">'+esc(t.name)+'</button>'+(t.fixed?'':'<button class="rm" data-r="'+i+'" aria-label="ลบเพลง">×</button>')+'</li>').join(""):'<li class="empty">ยังไม่มีเพลง — ไปที่แท็บ “เพิ่มเพลง”</li>';
    $("tt").textContent=cur>=0?pl[cur].name:(pl.length?pl[0].name:"ยังไม่มีเพลง");
  }
  function ui(){const p=!au.paused;pb.classList.toggle("playing",p);$("pi").innerHTML=p?PAUSE:PLAY;$("play").setAttribute("aria-label",p?"Pause":"Play")}
  function go(i){if(!pl.length)return;cur=(i+pl.length)%pl.length;au.src=pl[cur].url;au.play().catch(()=>{});render()}
  function toggle(){if(!pl.length){openDrawer("add");return}if(cur<0)return go(0);au.paused?au.play().catch(()=>{}):au.pause()}
  function openDrawer(t){const d=$("drawer");d.hidden=false;$("menu").setAttribute("aria-expanded","true");tab(t||"list")}
  function tab(t){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));L.hidden=t!=="list";$("addp").hidden=t!=="add"}
  $("menu").onclick=()=>{const d=$("drawer");d.hidden=!d.hidden;$("menu").setAttribute("aria-expanded",String(!d.hidden));if(!d.hidden)tab("list")};
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>tab(b.dataset.t));
  $("play").onclick=toggle;$("next").onclick=()=>go(cur+1);$("prev").onclick=()=>{au.currentTime>3?au.currentTime=0:go(cur-1)};
  L.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.i!==undefined)go(+b.dataset.i);
    else if(b.dataset.r!==undefined){const i=+b.dataset.r,t=pl[i];if(!t||t.fixed)return;if(t.id)dbDel(t.id);if(t.blob)URL.revokeObjectURL(t.url);pl.splice(i,1);
      if(i===cur){au.pause();au.removeAttribute("src");cur=-1}else if(i<cur)cur--;render();ui()}};
  $("vol").oninput=e=>au.volume=+e.target.value;
  $("seek").oninput=e=>{if(au.duration)au.currentTime=au.duration*e.target.value/100};
  au.ontimeupdate=()=>{if(au.duration)$("seek").value=au.currentTime/au.duration*100};
  au.onplay=au.onpause=ui;au.onended=()=>go(cur+1);au.onerror=()=>{if(pl.length>1)go(cur+1)};
  $("file").onchange=async e=>{
    for(const f of e.target.files){const t={name:f.name.replace(/\.[^.]+$/,""),url:URL.createObjectURL(f),blob:f};t.id=await dbPut({name:t.name,blob:f});pl.push(t)}
    e.target.value="";render();tab("list");if(cur<0&&pl.length)go(0)};
  /* IndexedDB (เก็บเพลงในเบราว์เซอร์; ถ้าใช้ไม่ได้ก็ยังเล่นได้ในหน้านี้) */
  function open(){return new Promise(r=>{try{const q=indexedDB.open("bioPlayer",1);q.onupgradeneeded=()=>q.result.createObjectStore("t",{keyPath:"id",autoIncrement:true});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}})}
  const req=(m,fn)=>new Promise(r=>{if(!db)return r(null);try{const s=db.transaction("t",m).objectStore("t"),q=fn(s);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}});
  const dbPut=o=>req("readwrite",s=>s.add(o)),dbDel=id=>req("readwrite",s=>s.delete(id)),dbAll=()=>req("readonly",s=>s.getAll());
  (async()=>{
    (CONFIG.playlist||[]).forEach(t=>t&&t.src&&pl.push({name:t.title||t.src,url:t.src,fixed:true}));
    render();ui();
    db=await open();const rows=(await dbAll())||[];
    rows.forEach(r=>pl.push({id:r.id,name:r.name,url:URL.createObjectURL(r.blob),blob:r.blob}));
    render();ui();
  })();
})();
/* particles */
(function(){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;if(reduce)return;
  const c=$("fx"),x=c.getContext("2d");let w,h,ps=[];
  const n=innerWidth<600?22:48;
  function size(){const d=Math.min(devicePixelRatio||1,2);w=c.width=innerWidth*d;h=c.height=innerHeight*d;}
  size();addEventListener("resize",size);
  for(let i=0;i<n;i++)ps.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.6,v:Math.random()*.00025+.00008,a:Math.random()*.6+.2});
  (function loop(){
    x.clearRect(0,0,w,h);x.fillStyle=T.primaryColor;
    for(const p of ps){p.y-=p.v;if(p.y<0){p.y=1;p.x=Math.random()}
      x.globalAlpha=p.a;x.beginPath();x.arc(p.x*w,p.y*h,p.r*(w/innerWidth),0,6.283);x.fill();}
    requestAnimationFrame(loop);
  })();
})();
</script>
